name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build the binaries and the deploy action
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/nook-admin ./cmd/nook-admin
          CGO_ENABLED=0 go build -trimpath -o /tmp/nook ./cmd/nook
          CGO_ENABLED=0 go build -trimpath -o /tmp/deploy-action ./cmd/deploy-action
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Dashboard UI build is committed and current
        working-directory: dashboard/ui
        run: |
          npm ci
          npm run build
          git diff --exit-code -- ../public || { echo "dashboard/public is stale: run npm run build in dashboard/ui and commit it"; exit 1; }
  changeset:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Does this PR release anything?
        run: |
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}"...HEAD -- '.changeset/*.md' | grep -v README.md || true)
          if [ -z "$added" ]; then
            echo "::notice::No changeset in this PR, so merging it won't publish a release. Add one with npx changeset if it should."
          else
            echo "Releases on merge:"; for f in $added; do cat "$f"; echo; done
            npx changeset status --since="origin/${{ github.base_ref }}"
          fi
