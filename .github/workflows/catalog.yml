# Builds the store catalog from catalog/apps/*.json, signs it with the release key and publishes it as the
# "catalog" release (index.json + index.json.sig), where servers fetch it. Daily, so new upstream releases
# reach servers (each app's update policy decides what happens then).
name: catalog
on:
  push:
    branches: [main]
    paths: ["catalog/**", "cmd/catalog-build/**", "internal/core/store.go"]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build (finds each app's release, pins its sha256)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/catalog-build catalog/apps > index.json
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./cmd/release-sign sign index.json > index.json.sig
      - name: Publish (unchanged apps don't re-publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view catalog >/dev/null 2>&1; then
            gh release create catalog --title "Store catalog" --latest=false --prerelease \
              --notes "The nook store's signed catalog (built by .github/workflows/catalog.yml). Not a nook release."
          fi
          old=$(gh release download catalog -p index.json -O - 2>/dev/null | jq -S '.apps' || echo none)
          new=$(jq -S '.apps' index.json)
          if [ "$old" = "$new" ]; then echo "catalog unchanged"; exit 0; fi
          gh release upload catalog index.json index.json.sig --clobber
          jq -r '.apps[] | "\(.id) \(.version)"' index.json
