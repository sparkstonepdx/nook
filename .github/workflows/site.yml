# Builds the website (landing page, docs from README.md, changelog) and publishes it to a nook site of its own.
# Pull requests that touch it get a preview. Needs NOOK_TOKEN: a deploy token for the app that serves it.
name: site

on:
  push:
    branches: [main]
    paths: [README.md, CHANGELOG.md, "docs/**", "site/**", package.json, .github/workflows/site.yml]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths: [README.md, CHANGELOG.md, "docs/**", "site/**", package.json, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      NOOK_TOKEN: ${{ secrets.NOOK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: github.event.action != 'closed'
        run: npm ci && npm run site
      - if: env.NOOK_TOKEN == ''
        run: echo "::warning::No NOOK_TOKEN secret, so the site was built but not published"
      - if: env.NOOK_TOKEN != ''
        uses: ./deploy
        id: nook
        with:
          token: ${{ secrets.NOOK_TOKEN }}
          site: nook
          dir: dist-site
      - if: steps.nook.outputs.url
        run: echo "Published to ${{ steps.nook.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
