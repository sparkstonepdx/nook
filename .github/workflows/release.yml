# Releases happen when changesets reach main (see .changeset/README.md):
#   1. a push to main with pending .changeset/*.md files: `changeset version` combines them (the biggest
#      bump wins), bumps package.json, writes CHANGELOG.md and commits that to main;
#   2. then, or on any push where package.json's version has no tag yet: tag vX.Y.Z, test, build both
#      architectures, sign checksums.txt, publish the release with the changelog as notes, move v1.
# Servers pick releases up with `nook-admin update` / the dashboard's Check now.
# One-time setup: scripts/setup-release-key.sh (signing key).
name: release
on:
  push:
    branches: [main]
  workflow_dispatch: # re-run the same check by hand
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: Apply pending changesets
        id: changesets
        run: |
          set -euo pipefail
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" -eq 0 ]; then echo "no pending changesets"; exit 0; fi
          npx changeset version
          version=$(node -p 'require("./package.json").version')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package.json package-lock.json CHANGELOG.md .changeset
          git commit -m "Release v$version"
          git push origin HEAD:main
      - name: Version
        id: version
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "$tag is already released; nothing to do"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "releasing $tag"
          fi
      - uses: actions/setup-go@v5
        if: steps.version.outputs.release == 'true'
        with:
          go-version-file: go.mod
      - name: Test
        if: steps.version.outputs.release == 'true'
        run: |
          test -s internal/update/signing.pub || { echo "run scripts/setup-release-key.sh first"; exit 1; }
          go vet ./... && go test ./...
      - name: Build
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            out="build/$arch"; mkdir -p "$out"
            for cmd in nook-admin nook; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "$out/$cmd" "./cmd/$cmd"
            done
            tar -C "$out" -czf "dist/nook_${TAG}_linux_${arch}.tar.gz" nook-admin nook
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Sign checksums
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./cmd/release-sign sign dist/checksums.txt > dist/checksums.txt.sig
      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          v="${TAG#v}"
          awk -v v="$v" '$0 == "## " v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md 2>/dev/null || true
          [ -s notes.md ] || echo "Release $TAG" > notes.md
          cat notes.md
      - name: Tag and publish
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag
          major="${TAG%%.*}"
          git tag -f "$major" HEAD && git push -f origin "refs/tags/$major"
