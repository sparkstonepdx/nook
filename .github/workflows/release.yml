# Publish signed binaries. Servers pick them up with `nook-admin update` (or the dashboard's Update button).
#
#   From GitHub: Actions → release → Run workflow → pick patch / minor / major (or type a version).
#                It tags main's latest commit and publishes, in one run.
#   From git:    push a tag like v1.2.3.
#
# One-time setup: scripts/setup-release-key.sh (makes the signing key, stores the private half as a repo secret).
name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which number to raise from the latest release
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: Or an exact version like v1.4.0 (overrides bump)
        required: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to find the latest version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Signing key is set up
        run: test -s internal/update/signing.pub || { echo "run scripts/setup-release-key.sh first"; exit 1; }
      - name: Version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          WANT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::release from main (this run is on $GITHUB_REF_NAME)"; exit 1
          fi
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          if [ -n "$WANT" ]; then
            tag="$WANT"
          else
            IFS=. read -r maj min pat <<< "${latest#v}"
            case "$BUMP" in
              major) tag="v$((maj + 1)).0.0" ;;
              minor) tag="v$maj.$((min + 1)).0" ;;
              *)     tag="v$maj.$min.$((pat + 1))" ;;
            esac
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$tag isn't a version like v1.2.3"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"; exit 1
          fi
          if [ "$(git tag --points-at HEAD 'v*.*.*' | head -1)" != "" ]; then
            echo "::error::main's latest commit is already released as $(git tag --points-at HEAD 'v*.*.*' | head -1)"; exit 1
          fi
          echo "latest release: $latest → $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: go vet ./... && go test ./...
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Build
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            out="build/$arch"; mkdir -p "$out"
            for cmd in nook-admin nook; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$TAG" -o "$out/$cmd" "./cmd/$cmd"
            done
            tar -C "$out" -czf "dist/nook_${TAG}_linux_${arch}.tar.gz" nook-admin nook
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./cmd/release-sign sign dist/checksums.txt > dist/checksums.txt.sig
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --generate-notes --title "$TAG" --verify-tag
      - name: Move the major tag (deploy action users pin @v1)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA" && git push -f origin "refs/tags/$major"
