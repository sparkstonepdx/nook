<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>How nook works: a repo deploys to its own app on one server, Caddy serves every site, the dashboard runs it all</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#3b4f9a"/></marker>
  </defs>
  <rect width="960" height="520" fill="#f6efe5"/>

  <!-- repos -->
  <g>
    <rect x="24" y="96" width="200" height="88" rx="12" fill="#fffaf0" stroke="#d9cdbb"/>
    <text x="44" y="128" font-size="17" font-weight="650" fill="#2a2420">you/shop</text>
    <text x="44" y="152" font-size="13" fill="#6b6258">a GitHub repo</text>
    <text x="44" y="170" font-size="13" fill="#6b6258">push, or open a PR</text>
    <rect x="24" y="216" width="200" height="88" rx="12" fill="#fffaf0" stroke="#d9cdbb"/>
    <text x="44" y="248" font-size="17" font-weight="650" fill="#2a2420">you/blog</text>
    <text x="44" y="272" font-size="13" fill="#6b6258">another repo</text>
    <text x="44" y="290" font-size="13" fill="#6b6258">each gets its own app</text>
  </g>
  <path d="M226 140 C 270 140, 270 200, 300 200" fill="none" stroke="#3b4f9a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M226 260 C 270 260, 270 220, 300 220" fill="none" stroke="#3b4f9a" stroke-width="2" marker-end="url(#a)"/>
  <text x="24" y="336" font-size="13" font-weight="600" fill="#3b4f9a">The deploy action</text>
  <text x="24" y="355" font-size="12" fill="#6b6258">uploads each build with the</text>
  <text x="24" y="372" font-size="12" fill="#6b6258">app's NOOK_TOKEN. A PR gets</text>
  <text x="24" y="389" font-size="12" fill="#6b6258">a preview site of its own.</text>

  <!-- server -->
  <rect x="304" y="24" width="632" height="472" rx="18" fill="#efe6d8" stroke="#cbbda8"/>
  <text x="328" y="58" font-size="19" font-weight="700" fill="#2a2420">One Debian server running nook</text>

  <!-- caddy -->
  <rect x="328" y="76" width="584" height="56" rx="12" fill="#3b4f9a"/>
  <text x="348" y="101" font-size="16" font-weight="650" fill="#fffaf0">Caddy</text>
  <text x="348" y="120" font-size="13" fill="#dfe3f4">HTTPS and certificates for every site, routed by hostname</text>

  <!-- app shop -->
  <rect x="328" y="152" width="280" height="190" rx="12" fill="#fffaf0" stroke="#d9cdbb"/>
  <text x="348" y="180" font-size="16" font-weight="650" fill="#2a2420">app: shop</text>
  <text x="348" y="199" font-size="12" fill="#6b6258">its own Linux user, folder and limits</text>
  <rect x="348" y="212" width="240" height="52" rx="8" fill="#f6efe5"/>
  <text x="362" y="234" font-size="13" font-weight="600" fill="#2a2420">shop.example.com</text>
  <text x="362" y="252" font-size="12" fill="#6b6258">web: a server on its $PORT, sandboxed</text>
  <rect x="348" y="272" width="240" height="52" rx="8" fill="#f6efe5"/>
  <text x="362" y="294" font-size="13" font-weight="600" fill="#2a2420">nightly-report</text>
  <text x="362" y="312" font-size="12" fill="#6b6258">cron: runs on a schedule</text>

  <!-- app blog -->
  <rect x="632" y="152" width="280" height="190" rx="12" fill="#fffaf0" stroke="#d9cdbb"/>
  <text x="652" y="180" font-size="16" font-weight="650" fill="#2a2420">app: blog</text>
  <text x="652" y="199" font-size="12" fill="#6b6258">one folder per site in sites/</text>
  <rect x="652" y="212" width="240" height="52" rx="8" fill="#f6efe5"/>
  <text x="666" y="234" font-size="13" font-weight="600" fill="#2a2420">blog.example.com</text>
  <text x="666" y="252" font-size="12" fill="#6b6258">static files, gzipped, _redirects</text>
  <rect x="652" y="272" width="240" height="52" rx="8" fill="#f6efe5"/>
  <text x="666" y="294" font-size="13" font-weight="600" fill="#2a2420">pr-42.blog.example.com</text>
  <text x="666" y="312" font-size="12" fill="#6b6258">a preview, gone when the PR closes</text>

  <path d="M468 132 V 150" stroke="#3b4f9a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M772 132 V 150" stroke="#3b4f9a" stroke-width="2" marker-end="url(#a)"/>

  <!-- dashboard, services, backups -->
  <rect x="328" y="362" width="184" height="110" rx="12" fill="#fffaf0" stroke="#d9cdbb"/>
  <text x="348" y="390" font-size="16" font-weight="650" fill="#2a2420">Dashboard</text>
  <text x="348" y="412" font-size="12" fill="#6b6258">apps, logs, env, domains,</text>
  <text x="348" y="429" font-size="12" fill="#6b6258">users, limits, headroom,</text>
  <text x="348" y="446" font-size="12" fill="#6b6258">updates; works on a phone</text>
  <rect x="528" y="362" width="184" height="110" rx="12" fill="#fffaf0" stroke="#d9cdbb"/>
  <text x="548" y="390" font-size="16" font-weight="650" fill="#2a2420">Store and services</text>
  <text x="548" y="412" font-size="12" fill="#6b6258">signed catalog apps;</text>
  <text x="548" y="429" font-size="12" fill="#6b6258">apps bind to a database</text>
  <text x="548" y="446" font-size="12" fill="#6b6258">and get DATABASE_URL</text>
  <rect x="728" y="362" width="184" height="110" rx="12" fill="#fffaf0" stroke="#d9cdbb"/>
  <text x="748" y="390" font-size="16" font-weight="650" fill="#2a2420">Backups</text>
  <text x="748" y="412" font-size="12" fill="#6b6258">daily, encrypted, to any</text>
  <text x="748" y="429" font-size="12" fill="#6b6258">S3 bucket; restore an app</text>
  <text x="748" y="446" font-size="12" fill="#6b6258">or the whole server</text>
</svg>
