name: nook deploy
description: Publish a folder to a nook server. Pull requests get a preview site that is removed when the PR closes.
inputs:
  token:
    description: The NOOK_TOKEN secret (a deploy token from the dashboard's Deploy page or `nook-admin token create`)
    required: true
  url:
    description: The dashboard's address, like https://admin.example.com (needed for deploy tokens)
    required: false
  env:
    description: KEY=value lines sent with the deploy (from secrets); they replace this site's "sent by deploys" env
    required: false
  site:
    description: Site name. "blog" = blog.<default domain>; "client.com" = exactly that hostname (needs a grant)
    required: true
  dir:
    description: Folder to publish. An executable "run" file inside makes it a running app. Not needed when a PR closes.
    required: false
    default: dist
  previews:
    description: Deploy pull requests to a preview site instead of the real one ("true" or "false")
    required: false
    default: "true"
  github-token:
    description: Token used to comment the preview URL on the PR (needs pull-requests write)
    required: false
    default: ${{ github.token }}
outputs:
  url:
    description: The deployed site's URL
    value: ${{ steps.deploy.outputs.url }}
  site:
    description: The site name that was deployed (the preview name on pull requests)
    value: ${{ steps.deploy.outputs.site }}
runs:
  using: composite
  steps:
    # The action is a small Go program built from this repo (standard library only). Use the runner's Go if it
    # has one (GOTOOLCHAIN fetches the version go.mod asks for); otherwise install it.
    - id: go
      shell: bash
      run: |
        if command -v go >/dev/null 2>&1; then echo "need=false" >> "$GITHUB_OUTPUT"; else echo "need=true" >> "$GITHUB_OUTPUT"; fi
    - if: steps.go.outputs.need == 'true'
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../go.mod
        cache: false
    - shell: bash
      working-directory: ${{ github.action_path }}/..
      env:
        GOTOOLCHAIN: auto
        CGO_ENABLED: "0"
        GOFLAGS: -mod=mod
      run: go build -trimpath -o "$RUNNER_TEMP/nook-deploy" ./cmd/deploy-action
    - id: deploy
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_SITE: ${{ inputs.site }}
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_PREVIEWS: ${{ inputs.previews }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: '"$RUNNER_TEMP/nook-deploy"'
